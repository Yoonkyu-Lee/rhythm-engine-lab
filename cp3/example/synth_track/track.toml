[[sound]]
id = "tick_odd"
file = "audio/tick_odd.flac"         # 30,697 Hz 비표준 레이트

[[sound]]
id = "piano_c"
file = "audio/piano_c.wav"           # MS-ADPCM

[[sound]]
id = "piano_e"
file = "audio/piano_e.wav"
