  { id = "SC", role = "scratch" },
  { id = "K1", role = "key" }, { id = "K2", role = "key" }, { id = "K3", role = "key" },
  { id = "K4", role = "key" }, { id = "K5", role = "key" }, { id = "K6", role = "key" },
